<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MetaMaze</title>
<style>
:root{--bg:#181818;--side:#1c1c1c;--card:#222222;--card2:#2a2a2a;--ink:#ffffff;--mut:#999999;--line:#323232;--pu:#ab9ff2;--pu2:#7c6ef0;--red:#ff5b5b;--grn:#21e56f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex}
.side{width:84px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:18px;padding:20px 0}
.side .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--mut);font-size:20px}.side .ic.on{background:var(--card2);color:var(--pu)}
.main{flex:1;overflow:auto;padding:28px 40px}
.head{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.head b{font-size:22px;letter-spacing:.3px}.pill{margin-left:auto;font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--line);padding:6px 14px;border-radius:99px}
.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;max-width:1180px}
.card{background:var(--card);border-radius:20px;padding:24px;border:1px solid var(--line);margin-bottom:22px}
.bal{font-size:44px;font-weight:700;margin:4px 0}.mut{color:var(--mut);font-size:13px}.up{color:var(--grn);font-size:14px}
h3{margin:0 0 6px;font-size:17px}
label{display:block;font-size:12px;color:var(--mut);margin:14px 0 6px}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:inherit;outline:0}input:focus{border-color:var(--pu)}
.btn{border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}.btn:active{transform:scale(.97)}
.pri{background:var(--pu);color:#1c1c1c;width:100%;margin-top:18px}.pri:hover{background:#c1b8f6}
.sec{background:rgba(171,159,242,.14);color:var(--pu);width:100%}.sec:hover{background:rgba(171,159,242,.24)}
.btn:disabled{opacity:.55;cursor:wait}
.act{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);font-size:13px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.ov.on{display:flex}
.pop{background:var(--card);border:1px solid var(--line);border-radius:24px;width:min(1080px,100%);height:min(720px,94vh);display:grid;grid-template-columns:1fr 1.05fr;overflow:hidden;animation:pin .3s ease}
@keyframes pin{from{opacity:0;transform:translateY(14px) scale(.98)}}
.col{padding:24px;display:flex;flex-direction:column;gap:14px;min-width:0;overflow:auto}
.col+.col{border-left:1px solid var(--line);background:var(--side)}
.row{display:flex;justify-content:space-between;gap:12px;font-size:13px}.row span:last-child{text-align:right;word-break:break-all}
.risk{border-radius:16px;padding:16px;border:1px solid var(--red);background:rgba(255,91,91,.09);animation:pin .4s}
.risk.ok{border-color:var(--grn);background:rgba(33,229,111,.08)}
.risk.warn{border-color:#ffc93c;background:rgba(255,201,60,.09)}
.risk h4{margin:0 0 8px;font-size:16px;color:var(--red)}.risk.ok h4{color:var(--grn)}.risk.warn h4{color:#ffd76a}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;max-width:100%;font-size:11px;line-height:1.35;padding:4px 10px;border-radius:99px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.06));backdrop-filter:blur(14px) saturate(180%);-webkit-backdrop-filter:blur(14px) saturate(180%);border:1px solid rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 14px rgba(0,0,0,.22);color:var(--red)}.chip.g{background:linear-gradient(180deg,rgba(33,229,111,.28),rgba(33,229,111,.08));border-color:rgba(33,229,111,.45);color:#b9ffd1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card2);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--mut)}.stat b{display:block;font-size:16px;color:var(--ink)}
.cta{display:flex;gap:12px;margin-top:auto}.cta .btn{flex:1}.deny{background:var(--card2);color:#fff}.ok2{background:var(--pu);color:#1c1c1c}
.scan{display:flex;align-items:center;gap:10px;color:var(--mut)}
/* ghost + agent stage */
.ghost{display:block;overflow:visible}
.stage{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px;position:relative;overflow:hidden}
.lane{position:relative;width:70px;height:60px;flex:none}
.lane .ghost{position:absolute;left:5px;top:2px;animation:flt 3s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-6px)}}
.pupil{transition:transform .2s}
.stage.think .lane .ghost{animation:glide 1.6s ease-in-out infinite}
@keyframes glide{0%{transform:translate(-4px,0) rotate(-8deg)}25%{transform:translate(8px,-8px) rotate(6deg)}50%{transform:translate(14px,0) rotate(8deg)}75%{transform:translate(2px,-8px) rotate(-6deg)}100%{transform:translate(-4px,0) rotate(-8deg)}}
.stage.think .pupil{animation:dart 1.1s steps(1) infinite}
@keyframes dart{0%{transform:translate(-2px,0)}33%{transform:translate(2px,-1px)}66%{transform:translate(2px,1px)}}
.stage.happy .lane .ghost{animation:hop .6s ease 2}
@keyframes hop{40%{transform:translateY(-14px) scale(1.08)}}
.orb{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--pu);opacity:0;left:0;top:28px}
.stage.think .orb{animation:orb 1.4s linear infinite}.orb:nth-child(2){animation-delay:.35s!important}.orb:nth-child(3){animation-delay:.7s!important}
@keyframes orb{0%{opacity:0;left:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;left:66px;transform:translateY(-18px)}}
.stage b{display:block;font-size:14px}.stage small{color:var(--mut);display:block;min-height:19px}
.stage.think small{color:var(--pu)}
.chat{flex:1;min-height:120px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-start;animation:pin .3s}
.m{padding:10px 14px;border-radius:14px;font-size:13px;max-width:92%}
.u{align-self:flex-end;background:var(--pu);color:#1c1c1c;border-bottom-right-radius:4px}
.a{background:var(--card);border:1px solid var(--line);border-top-left-radius:4px}.a p{margin:0 0 8px}.a p:last-child{margin:0}.a p b{color:var(--pu)}
.dots i{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--pu);animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.send{display:flex;gap:10px}.send .btn{width:auto;margin:0;padding:0 22px}
.err{color:var(--red);font-size:12px}
@media(max-width:900px){.side{display:none}.grid{grid-template-columns:1fr}.pop{grid-template-columns:1fr;height:94vh;overflow:auto}}

/* ===== hero + liquid glass ===== */
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none;animation:drift 18s ease-in-out infinite alternate}
body::before{width:520px;height:520px;background:#7c6ef0;opacity:.55;left:18%;top:-6%}
body::after{width:460px;height:460px;background:#21e56f;opacity:.18;right:6%;bottom:-8%;animation-delay:-8s}
@keyframes drift{to{transform:translate(90px,60px) scale(1.15)}}
.side,.main{position:relative;z-index:1}.side{background:rgba(28,28,28,.6);backdrop-filter:blur(14px)}
.glass{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.04));backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.08),0 24px 70px rgba(0,0,0,.45)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 55% at 18% 0%,rgba(255,255,255,.3),transparent 55%);pointer-events:none;mix-blend-mode:soft-light}
.wrap{max-width:760px;margin:0 auto}
.hero{border-radius:32px;padding:34px 40px;margin-bottom:22px;text-align:center;overflow:hidden}
.hero .hg{position:absolute;right:28px;top:18px;opacity:.95}
.hero .amt{display:flex;align-items:baseline;justify-content:center;gap:12px;margin:6px 0 4px}
.hero .amt input{width:260px;font-size:72px;font-weight:700;text-align:center;background:transparent;border:0;padding:0;color:#fff}
.hero .amt span{font-size:26px;color:var(--pu);font-weight:600}
.route{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;gap:14px;margin-top:24px;text-align:left}
.route .mut{margin:0 0 4px}
.route .ar{color:var(--pu);font-size:22px;padding-bottom:7px}
.route input{width:100%;min-width:0;height:38px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:9px 12px;font-size:13px}
.hero .pri{margin-top:24px;font-size:16px;padding:16px;border-radius:16px;box-shadow:0 8px 30px rgba(171,159,242,.4)}
.act-card{background:rgba(34,34,34,.55);backdrop-filter:blur(10px)}
.ov{background:rgba(10,8,20,.35);backdrop-filter:blur(4px)}
.pop{display:flex;width:auto;height:min(660px,94vh);border-radius:30px;border:1px solid rgba(255,255,255,.22);background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));backdrop-filter:blur(28px) saturate(190%);-webkit-backdrop-filter:blur(28px) saturate(190%);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.08),0 30px 90px rgba(0,0,0,.55);position:relative;transition:.3s}
.pop::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(110% 45% at 15% 0%,rgba(255,255,255,.3),transparent 55%);pointer-events:none;mix-blend-mode:soft-light;z-index:3}
.pop .c1{width:420px;flex:none}
.pop .c2{width:0;min-width:0;padding:24px 0;opacity:0;overflow:hidden;border-left:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.2);transition:width .5s cubic-bezier(.2,.8,.2,1),opacity .3s,padding .5s}
.pop.cp .c2{width:440px;padding:24px;opacity:1}
.c2 .in{width:392px;height:100%;display:flex;flex-direction:column;gap:14px}
.pop .stat,.pop .a,.pop .stage{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12)}
.pop .deny{background:rgba(255,255,255,.14)}.pop input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14)}
.pop .stage{padding:8px 12px}
.pop .c1{gap:8px;padding:16px 20px}.c1>*{flex-shrink:0}.c1 .stage{padding:6px 12px}.c1 .stats{gap:8px}.c1 .stat{padding:8px 10px}.c1 .stat b{font-size:15px}
.ask-btn{background:rgba(171,159,242,.16);color:var(--pu);border:1px solid rgba(171,159,242,.4);width:100%}
.ask-btn:hover{background:rgba(171,159,242,.28)}
@media(max-width:900px){.route{grid-template-columns:1fr}.route .ar{display:none}.pop.cp .c2{width:min(440px,70vw)}}

/* ===== liquid glass buttons ===== */
.btn{position:relative;overflow:hidden;backdrop-filter:blur(14px) saturate(180%);-webkit-backdrop-filter:blur(14px) saturate(180%)}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-20deg);transition:left .7s;pointer-events:none}
.btn:hover::after{left:140%}
.btn.pri,.btn.ok2{color:#fff;background:linear-gradient(180deg,rgba(201,192,255,.55),rgba(124,110,240,.42));border:1px solid rgba(255,255,255,.38);text-shadow:0 1px 8px rgba(0,0,0,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -10px 18px rgba(124,110,240,.35),0 8px 28px rgba(124,110,240,.38)}
.btn.pri:hover,.btn.ok2:hover{background:linear-gradient(180deg,rgba(215,208,255,.65),rgba(140,126,255,.55))}
.btn.deny,.btn.sec,.btn.ask-btn{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -8px 14px rgba(255,255,255,.04),0 6px 20px rgba(0,0,0,.25)}
.btn.ask-btn,.btn.sec{color:#d9d3ff;border-color:rgba(171,159,242,.5)}
.pop.danger .btn.ok2{background:linear-gradient(180deg,rgba(255,120,120,.55),rgba(190,20,40,.5));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -10px 18px rgba(190,20,40,.4),0 8px 28px rgba(255,50,50,.4)}
/* ===== danger banner ===== */
.risk:not(.ok):not(.warn){position:relative;overflow:hidden;border:1px solid rgba(255,80,80,.75);background:radial-gradient(120% 100% at 0% 0%,rgba(255,50,50,.5),rgba(120,0,20,.28) 65%),linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.02));backdrop-filter:blur(18px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 0 1px rgba(255,60,60,.25),0 0 34px rgba(255,50,50,.4);animation:dang 1.8s ease-in-out infinite;padding:18px 14px 12px}
.risk:not(.ok):not(.warn)::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:repeating-linear-gradient(135deg,#ff3b3b 0 10px,#1a0000 10px 20px)}
@keyframes dang{50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 0 1px rgba(255,60,60,.55),0 0 58px rgba(255,50,50,.7)}}
.risk h4{font-size:18px;letter-spacing:.6px;display:flex;align-items:center;gap:8px}
.risk:not(.ok):not(.warn) h4{color:#ff8a8a;text-shadow:0 0 14px rgba(255,60,60,.85)}
.wi{display:inline-block;animation:shk .8s infinite}@keyframes shk{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.warn{font-size:12px;color:#ffd0d0;margin:0 0 8px}
.risk:not(.ok):not(.warn) .chip{background:linear-gradient(180deg,rgba(255,90,90,.34),rgba(140,0,20,.22));border-color:rgba(255,130,130,.55);color:#ffe0e0;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 16px rgba(255,40,40,.28)}
.risk.warn{position:relative;overflow:hidden;border:1px solid rgba(255,201,60,.7);background:radial-gradient(120% 100% at 0% 0%,rgba(255,201,60,.28),rgba(90,60,0,.2) 65%),linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.02));backdrop-filter:blur(18px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 0 1px rgba(255,201,60,.22),0 0 28px rgba(255,201,60,.25);padding:18px 14px 12px}
.risk.warn::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:repeating-linear-gradient(135deg,#ffc93c 0 10px,#3a2a00 10px 20px)}
.risk.warn h4{text-shadow:0 0 14px rgba(255,201,60,.5)}
.risk.warn .warn{color:#ffe1a3}
.risk.warn .chip{background:linear-gradient(180deg,rgba(255,201,60,.3),rgba(120,80,0,.2));border-color:rgba(255,215,106,.5);color:#fff0c2;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 16px rgba(255,190,40,.2)}
/* ===== dashboard ===== */
.wrap{max-width:1120px}.hero{max-width:760px;margin-left:auto;margin-right:auto}
.dash{display:grid;grid-template-columns:1.5fr 1fr;gap:22px;align-items:start}
.gc{background:rgba(34,34,34,.55);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:22px;margin-bottom:22px}
.tot{font-size:38px;font-weight:700;line-height:1.1}.up{color:var(--grn)}.dn{color:var(--red)}
#chart svg{width:100%;height:190px;display:block;cursor:crosshair}
.tok{display:grid;grid-template-columns:2fr 1.3fr 1fr 96px 1.2fr;gap:10px;align-items:center;padding:11px 0;border-top:1px solid rgba(255,255,255,.08);font-size:13px}
.tok.h{border:0;color:var(--mut);font-size:11px;padding-top:2px}
.tk{display:flex;align-items:center;gap:10px}.tk small{display:block;color:var(--mut)}
.coin{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:11px;color:#fff;flex:none}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid rgba(255,255,255,.08);font-size:13px;animation:pin .35s}
.tx .r{margin-left:auto;text-align:right}.tx small{display:block;color:var(--mut)}
.ti{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:15px}
.bd{font-size:10px;padding:1px 7px;border-radius:99px;background:rgba(255,91,91,.2);color:var(--red);margin-left:6px}
@media(max-width:1000px){.dash{grid-template-columns:1fr}.tok{grid-template-columns:2fr 1fr 1fr}.tok>:nth-child(4),.tok>:nth-child(5){display:none}}

/* ===== fixed one-page layout ===== */
html,body{height:100%;overflow:hidden}
.side{width:64px;padding:16px 0;gap:14px}.side .ic{width:38px;height:38px;font-size:17px}
.main{height:100vh;display:flex;flex-direction:column;padding:16px 22px;overflow:hidden}
.head{margin-bottom:12px}.head b{font-size:19px}
.wrap2{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.cL,.cR{display:flex;flex-direction:column;gap:14px;min-height:0}
.gc{padding:16px 18px;margin:0}.gc h3{font-size:15px;margin:0 0 8px}
.fl{flex:1;min-height:0;display:flex;flex-direction:column}
.sc{overflow:auto;min-height:0;flex:1;padding-right:4px}
.sc::-webkit-scrollbar{width:5px}.sc::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:9px}
.hero{max-width:none;margin:0;padding:14px 22px 16px;border-radius:26px}
.hero .amt{margin:0}.hero .amt input{font-size:46px;width:200px}.hero .amt span{font-size:20px}
.hero .hg{right:18px;top:12px}
.route{margin-top:10px}.route input{padding:9px 12px}
.hero .pri{margin-top:12px;padding:12px;font-size:15px}
.tot{font-size:28px}#chart svg{height:100px}
.tok{padding:7px 0;font-size:12px}.tk{gap:9px}.tok svg.cn{flex:none}
.tx{padding:8px 0;font-size:12px}.ti{width:34px;height:34px;border-radius:11px}
.pop{height:min(660px,94vh)}.pop .c1{width:400px}.col{padding:20px;gap:12px}
</style></head><body>

    <div class="row"><span class="mut">To</span><span id="pTo"></span></div>

};
const wait = ms => new Promise(r => setTimeout(r, ms));
async function api(kind, body){
  if(CFG.mock){

  }
  const r = await fetch(CFG.base+CFG.paths[kind],{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});

    let d="";

      const e=await r.json();

}
function mockAnswer(b){
  const t=(b.user_request||"").toLowerCase();
  if(/first|last|when|date/.test(t)) return `The first inbound transaction was on ${b.first_in_ts} and the most recent on ${b.last_in_ts}. That is about ${Math.round((new Date(b.last_in_ts)-new Date(b.first_in_ts))/864e5)} days of activity.`;
  if(/approv/.test(t)) return `This address has ${b.approval_events} approval events across ${b.distinct_token_contracts} token contracts, which is worth reviewing for phishing-style drainers.`;
  return `It received ${b.tx_in_count} inbound transactions (${b.eth_in} ETH) from ${b.distinct_in_counterparties} distinct counterparties.`;
}
function responderText(res){
  const text = (res.agents||[]).find(a=>a.agent==="Responder")?.content || res.responder?.content || res.answer || "No answer returned.";
  const p = res.prediction || {};
  const skipped = String(p.model||"").toLowerCase() === "goplus" || (p.fraud_probability == null && String(p.verdict||"").toLowerCase() === "scam");
  if(!skipped) return text;
  const fixed = String(text)
    .replace(/identifies it as a scam with a red flag for a scam verdict/gi, "flags it as scam based on GoPlus red flags")
    .replace(/machine learning verdict/gi, "GoPlus security result")
    .replace(/ML verdict/gi, "GoPlus result")
    .replace(/machine learning model/gi, "ML model");
  return /ML model was not called|model was not called/i.test(fixed)
    ? fixed

}
function normalize(res){
  const gp = res.goplus_result || {};

  const verdict = String(p.verdict || (flags.length?"scam":"clean")).toLowerCase();
  const risky = p.red_flag === true || ["fraud","scam","malicious","phishing"].includes(verdict);
  return {flags, verdict, prob:p.fraud_probability ?? p.probability ?? null, risky, summary:responderText(res)};
}
function riskTier(prob, risky){
  if(prob == null) return risky ? {key:"danger", label:"DANGER"} : {key:"good", label:"GOOD"};
  const v = Math.max(0, Math.min(100, Math.round(prob*100)));
  if(v <= 33) return {key:"good", label:"GOOD"};
  if(v <= 67) return {key:"risk", label:"RISK"};
  return {key:"danger", label:"DANGER"};
}
